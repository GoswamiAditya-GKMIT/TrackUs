services:
  postgres:
    image: postgres:16-alpine
    container_name: trackus_postgres
    environment:
      POSTGRES_USER: trackus
      POSTGRES_PASSWORD: trackus123
      POSTGRES_DB: trackus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
